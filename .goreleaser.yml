# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

env:
    - GO111MODULE=on

before:
    hooks:
        # You may remove this if you don't use go modules.
        - go mod download
        # you may remove this if you don't need go generate
        - go generate ./...
        - ./bin/completion
        - ./bin/manpages
builds:
    - env:
          - CGO_ENABLED=0
      goos:
          - linux
          - windows
          - darwin
      goarch:
          - "386"
          - amd64
          - arm
          - arm64
          - ppc64
      ignore:
          - goos: windows
            goarch: arm
          - goos: windows
            goarch: ppc64
          - goos: darwin
            goarch: "386"
          - goos: darwin
            goarch: arm
          - goos: darwin
            goarch: ppc64
      mod_timestamp: "{{ .CommitTimestamp }}"
      ldflags:
          - -s -w -X github.com/tomba-io/tomba/pkg/version.Version={{.Version}} -X github.com/tomba-io/tomba/pkg/version.BuildDate={{.CommitDate}} -X github.com/tomba-io/tomba/pkg/version.Commit={{.ShortCommit}}
archives:
    - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
      formats:
          - tar.gz
      format_overrides:
          - goos: windows
            formats:
                - zip

homebrew_casks:
    - repository:
          owner: tomba-io
          name: homebrew-tap
      homepage: https://tomba.io
      directory: Casks
      description: CLI utility to find emails, verify addresses, discover phone numbers, and enrich company data in seconds.
      license: Apache-2.0
      manpages:
      - "./res/package/manpages/tomba.1.gz"
      completions:
       bash: "res/package/completion/tomba.bash"
       zsh: "res/package/completion/tomba.zsh"
       fish: "res/package/completion/tomba.fish"
      binaries:
          - tomba

scoops:
    - repository:
          owner: tomba-io
          name: scoop-bucket
      homepage: https://tomba.io
      directory: bucket
      description: CLI utility to find emails, verify addresses, discover phone numbers, and enrich company data in seconds.
      license: Apache-2.0

checksum:
    name_template: "{{ .ProjectName }}_checksums.txt"
nfpms:
    - file_name_template: "{{ .ProjectName }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
      homepage: https://tomba.io
      description: CLI utility to find emails, verify addresses, discover phone numbers, and enrich company data in seconds.
      maintainer: Mohamed Ben rebia <b.mohamed@tomba.io>
      license: Apache-2.0
      vendor: Tomba
      section: utils
      formats:
          - apk
          - deb
          - rpm
          - archlinux
      dependencies:
          - git
          - systemd
      recommends:
          - golang
      bindir: /usr/bin
      contents:
          - src: ./res/package/system/tomba.service
            dst: /lib/systemd/system/tomba.service
          - src: ./res/package/completion/tomba.bash
            dst: /usr/share/bash-completion/completions/tomba
            file_info:
                mode: 0644
          - src: ./res/package/completion/tomba.fish
            dst: /usr/share/fish/vendor_completions.d/tomba.fish
            file_info:
                mode: 0644
          - src: ./res/package/completion/tomba.zsh
            dst: /usr/share/zsh/vendor-completions/_tomba
            file_info:
                mode: 0644
          - src: ./res/package/manpages/tomba.1.gz
            dst: /usr/share/man/man1/tomba.1.gz
            file_info:
                mode: 0644
          - src: ./LICENSE
            dst: /usr/share/doc/tomba/copyright
            file_info:
                mode: 0644
      scripts:
          postinstall: ./res/package/scripts/postinstall.sh
      rpm:
          signature:
              key_file: /tmp/signing-key.gpg
      deb:
          signature:
              key_file: /tmp/signing-key.gpg
              type: origin

snapcrafts:
    - name: tomba
      summary: Find emails, verify addresses, discover phones, and enrich companies
      description: |
          Tomba.io CLI utility to find emails, verify addresses, discover phone numbers, and enrich company data in seconds. Process bulk CSV files with concurrent workers, unlimited rate limits, and auto-resume.

          Features:
          * Domain Search — instantly locate email addresses from any website
          * Email Finder — find someone's email by name and company domain
          * Email Verifier — confirm an email address' authenticity and deliverability
          * Email Enrichment — enrich email addresses with personal and company data
          * LinkedIn Finder — discover email addresses from LinkedIn profile URLs
          * Author Finder — discover email addresses of article authors
          * Phone Finder — get phone numbers associated with emails, domains, or LinkedIn URLs
          * Phone Validator — verify phone number validity, carrier, and line type
          * Company Enrichment — get detailed company data from domain names
          * Similar Domains — find similar websites and their email addresses
          * Technology Lookup — discover technologies used by domains
          * Email Count — count email addresses available for any domain
          * Bulk Processing — process CSV files with concurrent workers for all operations
          * Email Sources — find where an email address was publicly mentioned
      grade: stable
      confinement: strict
      license: Apache-2.0
      base: core24
      publish: true
      apps:
          tomba:
              command: tomba
              plugs:
                  - home
                  - network

changelog:
    sort: asc
    filters:
        exclude:
            - "^docs:"
            - "^test:"
            - Merge pull request
            - Merge branch
