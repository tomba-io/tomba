    <svg id="screen" width="1120" height="850" x="23" y="50" viewBox="0 0 1120 850" preserveAspectRatio="xMidYMin slice"><rect class="background" height="100%" width="100%" x="0" y="0"/><defs><g id="g1"><text x="0" textLength="16" font-weight="bold" class="color10">$ </text><text x="16" textLength="96" class="foreground">tomba --help</text></g><g id="g2"><text x="0" textLength="8" class="background"> </text></g><g id="g3"><text x="0" textLength="496" class="foreground">  autocomplete    Get domain suggestions from a partial query.</text></g><g id="g4"><text x="0" textLength="696" class="foreground">  bulk            Process a CSV file in bulk &#8212; auto-maps columns or use custom mapping.</text></g><g id="g5"><text x="0" textLength="744" class="foreground">  chat            Open AI chat with Tomba tools &#8212; auto-initializes your project on first run.</text></g><g id="g6"><text x="0" textLength="608" class="foreground">  completion      Generate the autocompletion script for the specified shell</text></g><g id="g7"><text x="0" textLength="568" class="foreground">  count           Returns total email addresses we have for one domain.</text></g><g id="g8"><text x="0" textLength="456" class="foreground">  enrich          Locate and include data in your emails.</text></g><g id="g9"><text x="0" textLength="472" class="foreground">  enrichment      Enrich person, company, or combined data.</text></g><g id="g10"><text x="0" textLength="856" class="foreground">  finder          Retrieves the most likely email address from a domain name, a first name and a last name.</text></g><g id="g11"><text x="0" textLength="480" class="foreground">  flag            Report incorrect data for credit recovery.</text></g><g id="g12"><text x="0" textLength="448" class="foreground">  format          Get the email format used by a domain.</text></g><g id="g13"><text x="0" textLength="320" class="foreground">  help            Help about any command</text></g><g id="g14"><text x="0" textLength="424" class="foreground">  http            Runs a HTTP server (reverse proxy).</text></g><g id="g15"><text x="0" textLength="272" class="foreground">  key             Manage API keys.</text></g><g id="g16"><text x="0" textLength="248" class="foreground">  lead            Manage leads.</text></g><g id="g17"><text x="0" textLength="296" class="foreground">  leads-list      Manage leads lists.</text></g><g id="g18"><text x="0" textLength="592" class="foreground">  linkedin        Instantly discover the email addresses of Linkedin URLs.</text></g><g id="g19"><text x="0" textLength="536" class="foreground">  location        Get the employees count by location for a domain.</text></g><g id="g20"><text x="0" textLength="336" class="foreground">  login           Sign in to Tomba account</text></g><g id="g21"><text x="0" textLength="504" class="foreground">  logout          delete your current KEY &amp; SECRET API session.</text></g><g id="g22"><text x="0" textLength="664" class="foreground">  logs            Check your last 1,000 requests you made during the last 3 months.</text></g><g id="g23"><text x="0" textLength="664" class="foreground">  phone-finder    Search for phone numbers given an email, domain, or LinkedIn URL.</text></g><g id="g24"><text x="0" textLength="328" class="foreground">  phone-validator Validate phone numbers.</text></g><g id="g25"><text x="0" textLength="672" class="foreground">  reveal          Search for companies using natural language or structured filters.</text></g><g id="g26"><text x="0" textLength="672" class="foreground">  search          Instantly locate email addresses from any company name or website.</text></g><g id="g27"><text x="0" textLength="512" class="foreground">  similar         Retrieve domains similar to a specific domain.</text></g><g id="g28"><text x="0" textLength="544" class="foreground">  skill           ClawHub &#8212; manage and run reusable Tomba workflows.</text></g><g id="g29"><text x="0" textLength="512" class="foreground">  sources         Find email address source somewhere on the web</text></g><g id="g30"><text x="0" textLength="544" class="foreground">  status          Returns domain status if is webmail or disposable.</text></g><g id="g31"><text x="0" textLength="496" class="foreground">  technology      Discover technologies detected for a domain.</text></g><g id="g32"><text x="0" textLength="368" class="foreground">  usage           Check your monthly requests.</text></g><g id="g33"><text x="0" textLength="512" class="foreground">  verify          Verify the deliverability of an email address.</text></g><g id="g34"><text x="0" textLength="488" class="foreground">  version         Print version number and build information.</text></g><g id="g35"><text x="0" textLength="416" class="foreground">  whoami          Print current account information.</text></g><g id="g36"><text x="0" textLength="48" class="foreground">Flags:</text></g><g id="g37"><text x="0" textLength="336" class="foreground">      --csv             output CSV format.</text></g><g id="g38"><text x="0" textLength="304" class="foreground">  -h, --help            help for tomba</text></g><g id="g39"><text x="0" textLength="344" class="foreground">  -j, --json            output JSON format.</text></g><g id="g40"><text x="0" textLength="304" class="foreground">  -k, --key string      Tomba API KEY.</text></g><g id="g41"><text x="0" textLength="376" class="foreground">      --no-color        Disable colored output.</text></g><g id="g42"><text x="0" textLength="392" class="foreground">  -o, --output string   Save the results to file.</text></g><g id="g43"><text x="0" textLength="720" class="foreground">  -p, --port int        Sets the port on which the HTTP server should bind. (default 3000)</text></g><g id="g44"><text x="0" textLength="328" class="foreground">  -s, --secret string   Tomba API SECRET.</text></g><g id="g45"><text x="0" textLength="696" class="foreground">  -t, --target string   TARGET SPECIFICATION Can pass email, Domain, URL, Linkedin URL.</text></g><g id="g46"><text x="0" textLength="368" class="foreground">      --verbose         Enable verbose output.</text></g><g id="g47"><text x="0" textLength="328" class="foreground">  -v, --version         version for tomba</text></g><g id="g48"><text x="0" textLength="344" class="foreground">  -y, --yaml            output YAML format.</text></g><g id="g49"><text x="0" textLength="528" class="foreground">Use "tomba [command] --help" for more information about a command.</text></g></defs><g id="screen_view"><g><use xlink:href="#g1" y="0"/><rect x="0" y="17" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="17"/></g><g><use xlink:href="#g3" y="884"/><use xlink:href="#g4" y="901"/><use xlink:href="#g5" y="918"/><use xlink:href="#g6" y="935"/><use xlink:href="#g7" y="952"/><use xlink:href="#g8" y="969"/><use xlink:href="#g9" y="986"/><use xlink:href="#g10" y="1003"/><use xlink:href="#g11" y="1020"/><use xlink:href="#g12" y="1037"/><use xlink:href="#g13" y="1054"/><use xlink:href="#g14" y="1071"/><use xlink:href="#g15" y="1088"/><use xlink:href="#g16" y="1105"/><use xlink:href="#g17" y="1122"/><use xlink:href="#g18" y="1139"/><use xlink:href="#g19" y="1156"/><use xlink:href="#g20" y="1173"/><use xlink:href="#g21" y="1190"/><use xlink:href="#g22" y="1207"/><use xlink:href="#g23" y="1224"/><use xlink:href="#g24" y="1241"/><use xlink:href="#g25" y="1258"/><use xlink:href="#g26" y="1275"/><use xlink:href="#g27" y="1292"/><use xlink:href="#g28" y="1309"/><use xlink:href="#g29" y="1326"/><use xlink:href="#g30" y="1343"/><use xlink:href="#g31" y="1360"/><use xlink:href="#g32" y="1377"/><use xlink:href="#g33" y="1394"/><use xlink:href="#g34" y="1411"/><use xlink:href="#g35" y="1428"/><use xlink:href="#g36" y="1462"/><use xlink:href="#g37" y="1479"/><use xlink:href="#g38" y="1496"/><use xlink:href="#g39" y="1513"/><use xlink:href="#g40" y="1530"/><use xlink:href="#g41" y="1547"/><use xlink:href="#g42" y="1564"/><use xlink:href="#g43" y="1581"/><use xlink:href="#g44" y="1598"/><use xlink:href="#g45" y="1615"/><use xlink:href="#g46" y="1632"/><use xlink:href="#g47" y="1649"/><use xlink:href="#g48" y="1666"/><use xlink:href="#g49" y="1700"/><rect x="0" y="1717" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="1717"/></g></g></svg>
