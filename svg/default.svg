<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="terminal" baseProfile="full" viewBox="0 0 1167 931" width="1167" version="1.1">
    <defs>
        <termtosvg:template_settings xmlns:termtosvg="https://github.com/nbedos/termtosvg">
            <termtosvg:screen_geometry columns="140" rows="50"/>
            <termtosvg:animation type="css"/>
        </termtosvg:template_settings>
        <style type="text/css" id="generated-style"><![CDATA[#screen {
                font-family: 'DejaVu Sans Mono', monospace;
                font-style: normal;
                font-size: 14px;
            }

        text {
            dominant-baseline: text-before-edge;
            white-space: pre;
        }
    
            :root {
                --animation-duration: 1500ms;
            }

            @keyframes roll {
                0.000%{transform:translateY(0px)}
33.333%{transform:translateY(-884px)}
100.000%{transform:translateY(-884px)}
            }

            #screen_view {
                animation-duration: 1500ms;
                animation-iteration-count:infinite;
                animation-name:roll;
                animation-timing-function: steps(1,end);
                animation-fill-mode: forwards;
            }
        ]]></style>
        <style type="text/css" id="user-style">
            /* The colors defined below are the default 16 colors used for rendering text of the terminal. Adjust
               them as needed.
               gjm8 color theme (source: https://terminal.sexy/) */
            .foreground {fill: #f8f8f2}
            .background {fill: #272822}
            .color0 {fill: #272822}
            .color1 {fill: #f92672}
            .color2 {fill: #a6e22e}
            .color3 {fill: #f4bf75}
            .color4 {fill: #66d9ef}
            .color5 {fill: #ae81ff}
            .color6 {fill: #a1efe4}
            .color7 {fill: #f8f8f2}
            .color8 {fill: #75715e}
            .color9 {fill: #fd971f}
            .color10 {fill: #383830}
            .color11 {fill: #49483e}
            .color12 {fill: #a59f85}
            .color13 {fill: #f5f4f1}
            .color14 {fill: #cc6633}
            .color15 {fill: #f9f8f5}
        </style>
    </defs>
    <rect id="terminalui" class="background" width="100%" height="100%" ry="4.5826941"/>
