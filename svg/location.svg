    <svg id="screen" width="1120" height="850" x="23" y="50" viewBox="0 0 1120 850" preserveAspectRatio="xMidYMin slice"><rect class="background" height="100%" width="100%" x="0" y="0"/><defs><g id="g1"><text x="0" textLength="16" font-weight="bold" class="color10">$ </text><text x="16" textLength="168" class="foreground">tomba location --help</text></g><g id="g2"><text x="0" textLength="8" class="background"> </text></g><g id="g3"><text x="0" textLength="1120" class="foreground">CLI utility to search or verify lists of email addresses in seconds can significantly improve productivity and efficiency for individuals an</text></g><g id="g4"><text x="0" textLength="384" class="foreground">d businesses dealing with large email databases.</text></g><g id="g5"><text x="0" textLength="512" class="color8">    &#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9559; &#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9559; &#9608;&#9608;&#9608;&#9559;   &#9608;&#9608;&#9608;&#9559;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9559;  &#9608;&#9608;&#9608;&#9608;&#9608;&#9559;    &#9608;&#9608;&#9559; &#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9559; </text></g><g id="g6"><text x="0" textLength="512" class="color8">    &#9562;&#9552;&#9552;&#9608;&#9608;&#9556;&#9552;&#9552;&#9565;&#9608;&#9608;&#9556;&#9552;&#9552;&#9552;&#9608;&#9608;&#9559;&#9608;&#9608;&#9608;&#9608;&#9559; &#9608;&#9608;&#9608;&#9608;&#9553;&#9608;&#9608;&#9556;&#9552;&#9552;&#9608;&#9608;&#9559;&#9608;&#9608;&#9556;&#9552;&#9552;&#9608;&#9608;&#9559;   &#9608;&#9608;&#9553;&#9608;&#9608;&#9556;&#9552;&#9552;&#9552;&#9608;&#9608;&#9559;</text></g><g id="g7"><text x="0" textLength="512" class="color8">       &#9608;&#9608;&#9553;   &#9608;&#9608;&#9553;   &#9608;&#9608;&#9553;&#9608;&#9608;&#9556;&#9608;&#9608;&#9608;&#9608;&#9556;&#9608;&#9608;&#9553;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9556;&#9565;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9553;   &#9608;&#9608;&#9553;&#9608;&#9608;&#9553;   &#9608;&#9608;&#9553;</text></g><g id="g8"><text x="0" textLength="512" class="color8">       &#9608;&#9608;&#9553;   &#9608;&#9608;&#9553;   &#9608;&#9608;&#9553;&#9608;&#9608;&#9553;&#9562;&#9608;&#9608;&#9556;&#9565;&#9608;&#9608;&#9553;&#9608;&#9608;&#9556;&#9552;&#9552;&#9608;&#9608;&#9559;&#9608;&#9608;&#9556;&#9552;&#9552;&#9608;&#9608;&#9553;   &#9608;&#9608;&#9553;&#9608;&#9608;&#9553;   &#9608;&#9608;&#9553;</text></g><g id="g9"><text x="0" textLength="512" class="color8">       &#9608;&#9608;&#9553;   &#9562;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9556;&#9565;&#9608;&#9608;&#9553; &#9562;&#9552;&#9565; &#9608;&#9608;&#9553;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9556;&#9565;&#9608;&#9608;&#9553;  &#9608;&#9608;&#9553;&#9608;&#9608;&#9559;&#9608;&#9608;&#9553;&#9562;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9556;&#9565;</text></g><g id="g10"><text x="0" textLength="512" class="color8">       &#9562;&#9552;&#9565;    &#9562;&#9552;&#9552;&#9552;&#9552;&#9552;&#9565; &#9562;&#9552;&#9565;     &#9562;&#9552;&#9565;&#9562;&#9552;&#9552;&#9552;&#9552;&#9552;&#9565; &#9562;&#9552;&#9565;  &#9562;&#9552;&#9565;&#9562;&#9552;&#9565;&#9562;&#9552;&#9565; &#9562;&#9552;&#9552;&#9552;&#9552;&#9552;&#9565; </text></g><g id="g11"><text x="0" textLength="56" class="color8">       </text></g><g id="g12"><text x="0" textLength="32" class="color8">    </text></g><g id="g13"><text x="0" textLength="48" class="foreground">Usage:</text></g><g id="g14"><text x="0" textLength="192" class="foreground">  tomba location [flags]</text></g><g id="g15"><text x="0" textLength="72" class="foreground">Examples:</text></g><g id="g16"><text x="0" textLength="240" class="foreground">  tomba location -t "tomba.io"</text></g><g id="g17"><text x="0" textLength="280" class="foreground">  tomba location -t "stripe.com" -j</text></g><g id="g18"><text x="0" textLength="48" class="foreground">Flags:</text></g><g id="g19"><text x="0" textLength="256" class="foreground">  -h, --help   help for location</text></g><g id="g20"><text x="0" textLength="104" class="foreground">Global Flags:</text></g><g id="g21"><text x="0" textLength="336" class="foreground">      --csv             output CSV format.</text></g><g id="g22"><text x="0" textLength="344" class="foreground">  -j, --json            output JSON format.</text></g><g id="g23"><text x="0" textLength="304" class="foreground">  -k, --key string      Tomba API KEY.</text></g><g id="g24"><text x="0" textLength="376" class="foreground">      --no-color        Disable colored output.</text></g><g id="g25"><text x="0" textLength="392" class="foreground">  -o, --output string   Save the results to file.</text></g><g id="g26"><text x="0" textLength="720" class="foreground">  -p, --port int        Sets the port on which the HTTP server should bind. (default 3000)</text></g><g id="g27"><text x="0" textLength="328" class="foreground">  -s, --secret string   Tomba API SECRET.</text></g><g id="g28"><text x="0" textLength="696" class="foreground">  -t, --target string   TARGET SPECIFICATION Can pass email, Domain, URL, Linkedin URL.</text></g><g id="g29"><text x="0" textLength="368" class="foreground">      --verbose         Enable verbose output.</text></g><g id="g30"><text x="0" textLength="344" class="foreground">  -y, --yaml            output YAML format.</text></g></defs><g id="screen_view"><g><use xlink:href="#g1" y="0"/><rect x="0" y="17" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="17"/></g><g><use xlink:href="#g1" y="884"/><use xlink:href="#g3" y="901"/><use xlink:href="#g4" y="918"/><use xlink:href="#g5" y="969"/><use xlink:href="#g6" y="986"/><use xlink:href="#g7" y="1003"/><use xlink:href="#g8" y="1020"/><use xlink:href="#g9" y="1037"/><use xlink:href="#g10" y="1054"/><use xlink:href="#g11" y="1071"/><use xlink:href="#g12" y="1088"/><use xlink:href="#g13" y="1122"/><use xlink:href="#g14" y="1139"/><use xlink:href="#g15" y="1173"/><use xlink:href="#g16" y="1190"/><use xlink:href="#g17" y="1207"/><use xlink:href="#g18" y="1241"/><use xlink:href="#g19" y="1258"/><use xlink:href="#g20" y="1292"/><use xlink:href="#g21" y="1309"/><use xlink:href="#g22" y="1326"/><use xlink:href="#g23" y="1343"/><use xlink:href="#g24" y="1360"/><use xlink:href="#g25" y="1377"/><use xlink:href="#g26" y="1394"/><use xlink:href="#g27" y="1411"/><use xlink:href="#g28" y="1428"/><use xlink:href="#g29" y="1445"/><use xlink:href="#g30" y="1462"/><rect x="0" y="1479" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="1479"/></g></g></svg>
