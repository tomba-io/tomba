name: tomba
icon: logo.png
summary: Find emails, verify addresses, discover phones, and enrich companies
description: |
    Tomba.io CLI utility to find emails, verify addresses, discover phone numbers, and enrich company data in seconds. Process bulk CSV files with concurrent workers, unlimited rate limits, and auto-resume.

    Features:
    * Domain Search — instantly locate email addresses from any website https://tomba.io/domain-search
    * Email Finder — find someone's email by name and company domain https://tomba.io/email-finder
    * Email Verifier — confirm an email address' authenticity and deliverability https://tomba.io/email-verifier
    * Email Enrichment — enrich email addresses with personal and company data https://tomba.io/enrichment
    * LinkedIn Finder — discover email addresses from LinkedIn profile URLs https://tomba.io/linkedin-finder
    * Author Finder — discover email addresses of article authors https://tomba.io/author-finder
    * Phone Finder — get phone numbers associated with emails, domains, or LinkedIn URLs https://tomba.io/phone-finder
    * Phone Validator — verify phone number validity, carrier, and line type
    * Company Enrichment — get detailed company data from domain names
    * Similar Domains — find similar websites and their email addresses
    * Technology Lookup — discover technologies used by domains
    * Email Count — count email addresses available for any domain
    * Bulk Processing — process CSV files with concurrent workers for all operations
    * Email Sources — find where an email address was publicly mentioned

    This snap is built via the build.snapcraft.io service from the snapcraft.yaml definition at https://github.com/tomba-io/tomba to ensure source and build transparency.
issues: https://github.com/tomba-io/tomba/issues
license: "Apache-2.0"
source-code: https://github.com/tomba-io/tomba.git
website: https://tomba.io/
version: 1.1.4
grade: stable
base: core24

confinement: strict

apps:
    tomba:
        command: bin/tomba
        plugs:
            - home
            - network

parts:
    go-deps:
        plugin: nil
        build-snaps:
            - go/latest/stable
    tomba:
        plugin: go
        source-type: git
        source: https://github.com/tomba-io/tomba
        after:
            - go-deps
